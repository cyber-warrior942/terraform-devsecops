name: Checkov Terraform Security Scan

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/*.hcl'

 # push:
   # branches:
    #  - main
  #  paths:
   #   - '**/*.tf'
     # - '**/*.tfvars'
   #   - '**/*.hcl'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkov:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # Checkout Terraform code
      # ---------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Run Checkov
      #
      # soft_fail: false means:
      #
      # Checkov findings → workflow FAIL
      #
      # This is important for using Checkov as a security gate.
      # ---------------------------------------------------------

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform

          # Human-readable output only.
          output_format: cli

          # Fail the GitHub Actions job when checks fail.
          soft_fail: false

          # Show passed checks as well.
          compact: true


      # ---------------------------------------------------------
      # Create GitHub Actions Job Summary
      # ---------------------------------------------------------

      - name: Generate Checkov Security Summary
        if: always()
        run: |

          echo "# 🔐 Checkov Terraform Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "## Scan Information" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scanner | Checkov |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Framework | Terraform |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | ${{ github.ref_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.checkov.outcome }}" = "success" ]; then

            echo "## ✅ Security Check Passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No failing Checkov security policies were detected." \
              >> "$GITHUB_STEP_SUMMARY"

          else

            echo "## ❌ Security Check Failed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Checkov detected one or more Terraform security policy violations." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Review the **Run Checkov** step above for the complete findings, including:" \
              >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Check ID" >> "$GITHUB_STEP_SUMMARY"
            echo "- Terraform resource" >> "$GITHUB_STEP_SUMMARY"
            echo "- File and line number" >> "$GITHUB_STEP_SUMMARY"
            echo "- Failed security policy" >> "$GITHUB_STEP_SUMMARY"
            echo "- Recommended remediation" >> "$GITHUB_STEP_SUMMARY"

          fi
